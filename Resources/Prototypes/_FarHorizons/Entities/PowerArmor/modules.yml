- type: entity
  id: PowerArmorModuleBase
  name: Power Armor Module Base
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
  - type: Item
    size: Small
  - type: InteractionOutline
  - type: Clickable
  - type: PowerArmorModule

- type: entity
  id: PowerArmorModuleIDLockSecurityNT
  name: ID Lock Module
  suffix: NT, Security
  parent: PowerArmorModuleBase
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  - type: PowerArmorPassiveModule
    comps:
      - type: IdClothingBlocker
        allowedJobs:
          - Security
      - type: AccessReader
        access: [["Armory"]]
  - type: PowerArmorModule
    canBeToggled: false

- type: entity
  id: PowerArmorModuleSecurityVisor
  name: Security Visor Module
  suffix: Security
  parent: PowerArmorModuleBase
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  - type: PowerArmorPassiveModule
    comps:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails
  - type: PowerArmorModule
    addToOtherHalf: true
    activePowerDrain: 1.5
    complexity: 2
