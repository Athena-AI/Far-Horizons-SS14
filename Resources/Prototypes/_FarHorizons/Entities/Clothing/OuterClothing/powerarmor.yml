- type: entity
  id: PowerArmorNaked
  name: Power Armor
  description: A modular hardsuit that is able to add or remove parts. It has a powered exoskeleton underneath in order to assist user moving the extra weight.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/PowerArmor/powerarmor.rsi
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.UnderArmor" ]
      state: underarmor
    - map: [ "enum.PowerArmorVisualLayers.Chest" ]
    - map: [ "enum.PowerArmorVisualLayers.RArm" ]
    - map: [ "enum.PowerArmorVisualLayers.LArm" ]
    - map: [ "enum.PowerArmorVisualLayers.RLeg" ]
    - map: [ "enum.PowerArmorVisualLayers.LLeg" ]
  - type: Clothing
    slots: [ OUTERCLOTHING ]
    equipSound: /Audio/Mecha/mechmove03.ogg 
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 3.0 
    unequipDelay: 3.0 
    clothingVisuals: 
      outerClothing:
      - map: [ "enum.PowerArmorVisualLayers.UnderArmor" ]
        state: underarmor
      - map: [ "enum.PowerArmorVisualLayers.Chest" ]
      - map: [ "enum.PowerArmorVisualLayers.RArm" ]
      - map: [ "enum.PowerArmorVisualLayers.LArm" ]
      - map: [ "enum.PowerArmorVisualLayers.RLeg" ]
      - map: [ "enum.PowerArmorVisualLayers.LLeg" ]
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: HeldSpeedModifier
  - type: Pierceable
    level: Metal
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      parts: !type:Container
        ents: []
  - type: GroupExamine
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
    - IPCExternalCooling 
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10 
    slots: OUTERCLOTHING
  - type: HideLayerClothing
    slots:
    - Tail
  - type: ArmorSparkEffect
  - type: SpaceRescuePingSender 
  - type: HeatRadiationBlocker
  - type: ToggleableClothing
    clothingPrototype: PowerArmorHelmetNaked
  - type: PowerArmor

- type: entity
  parent: PowerArmorNaked
  id: PowerArmorNTJuggernautFilled
  suffix: NT, Filled
  components:
  - type: ToggleableClothing
    clothingPrototype: PowerArmorHelmetNTJuggernautFilled
  - type: ContainerFill
    containers:
      parts:
        - PowerArmorChestNTJuggernaut
        - PowerArmorLArmNTJuggernaut
        - PowerArmorRArmNTJuggernaut
        - PowerArmorLLegNTJuggernaut
        - PowerArmorRLegNTJuggernaut