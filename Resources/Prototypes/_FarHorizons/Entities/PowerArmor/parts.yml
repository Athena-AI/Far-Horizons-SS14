- type: entity
  id: PowerArmorPartBase
  name: Power Armor Part Base
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Normal
  - type: InteractionOutline
  - type: Clickable
  - type: Appearance
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/PowerArmor/powerarmor.rsi
  - type: PowerArmorPart
    partType: Head
  - type: Damageable
    damageContainer: LimbDamageContainer

#region Base Parts
- type: entity
  id: PowerArmorHelmetBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.Head"]
      offset: 0, -0.25 
      state: equipped-head
  - type: PowerArmorPart
    partType: Head

- type: entity
  id: PowerArmorChestBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.Chest"]
      state: chest
  - type: PowerArmorPart
    partType: Chest

- type: entity
  id: PowerArmorLArmBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.LArm"]
      offset: 0.25, 0
      state: larm
  - type: PowerArmorPart
    partType: LArm

- type: entity
  id: PowerArmorRArmBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.RArm"]
      offset: -0.25, 0
      state: rarm
  - type: PowerArmorPart
    partType: RArm

- type: entity
  id: PowerArmorLLegBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.LLeg"]
      offset: 0.125, 0.25
      state: lleg
  - type: PowerArmorPart
    partType: LLeg

- type: entity
  id: PowerArmorRLegBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.RLeg"]
      offset: -0.125, 0.25
      state: rleg
  - type: PowerArmorPart
    partType: RLeg

#region NanoTrasen
- type: entity
  id: PowerArmorNTJuggernaut
  parent: PowerArmorPartBase
  name: NanoTrasen Heavy Hardsuit
  abstract: true
  components:
  - type: PowerArmorPart
    modifiers:
      flatReductions:
        Piercing: 5
        Heat: 4
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
    brokenModifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70 
        Heat: 0.80
        Radiation: 0.25
    speedModifier: 0.085 #Its Additive Per Piece also remember there is already a 40% speed reduc from the poweramor itself
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10 #For Debug Purposes
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]

#region Head

- type: entity
  id: PowerArmorHelmetNTJuggernaut
  parent: [ PowerArmorHelmetBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Helmet
  description: A helmet developed by Telos Industries made of pure plasteel that can take excessive amounts of punishment before requiring repairs.

#region Chest

- type: entity
  id: PowerArmorChestNTJuggernaut
  parent: [PowerArmorChestBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Chest

#region Arms

- type: entity
  id: PowerArmorLArmNTJuggernaut
  parent: [PowerArmorLArmBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Left Arm

- type: entity
  id: PowerArmorRArmNTJuggernaut
  parent: [PowerArmorRArmBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Right Arm

#region Legs

- type: entity
  id: PowerArmorLLegNTJuggernaut
  parent: [PowerArmorLLegBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Left Leg

- type: entity
  id: PowerArmorRLegNTJuggernaut
  parent: [PowerArmorRLegBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Right Leg