- type: entity
  id: PowerArmorModuleBase
  name: Power Armor Module Base
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Misc/PowerArmor/modules.rsi
  - type: Item
    size: Small
  - type: InteractionOutline
  - type: Clickable
  - type: PowerArmorModule

- type: entity
  id: PowerArmorModuleIDLockSecurityNT
  name: ID Lock Module
  suffix: NT, Security
  parent: PowerArmorModuleBase
  components:
  - type: Sprite
    layers:
    - state: dnalock
  - type: PowerArmorPassiveModule
    comps:
      - type: IdClothingBlocker
        allowedJobs:
          - Security
      - type: AccessReader
        access: [["Security"]]
  - type: PowerArmorModule
    canBeToggled: false

- type: entity
  id: PowerArmorModuleSecurityVisor
  name: Security Visor Module
  suffix: Security
  parent: PowerArmorModuleBase
  components:
  - type: Sprite
    layers:
    - state: sechud_visor
  - type: PowerArmorPassiveModule
    comps:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails
  - type: PowerArmorModule
    addToOtherHalf: true
    activePowerDrain: 1.5
    complexityCost: 2