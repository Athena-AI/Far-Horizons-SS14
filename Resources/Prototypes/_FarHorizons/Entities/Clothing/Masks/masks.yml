- type: entity
  parent: [ ClothingMaskGas, BaseSecurityContraband ]
  id: ClothingMaskGasCorpsman
  name: Biohazard Gas Mask
  description: VERY Expensive medical PPE.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/Mask/corpsmangas.rsi
  - type: Clothing
    sprite: _FarHorizons/Clothing/Mask/corpsmangas.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    hideOnToggle: true
  - type: Pierceable
    level: Metal
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.90
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskClownDoc
  name: Doctor Chuckles
  description: Surely this doctor won't let you rot.. right?
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/Mask/docclown.rsi
    state: icon
  - type: Clothing
    sprite: _FarHorizons/Clothing/Mask/docclown.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
      - PetWearable
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout

- type: entity
  parent: [ClothingMaskGas, BaseSecurityContraband]
  id: ClothingMaskGasSecurityNoHailer
  name: Damaged Security Gas Mask
  description: A standard issue Security gas mask. Seems to have it's hailer violently torn out with a sticky note slapped on it reading "USE THIS!"
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Clothing/Mask/gassecurity.rsi
  - type: Clothing
    sprite: Clothing/Mask/gassecurity.rsi
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: Tag
    tags:
    - HeavySecSuit

## Syndicate Station


- type: entity
  parent: [ClothingMaskGasAtmos, BaseCommandContraband]
  id: ClothingMaskGasCaptainSyndi
  name: Commandant's Gas Mask
  description: The Syndicate cut corners and repainted a spare atmospheric gas mask, but don't tell anyone.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/Mask/syndigascaptain.rsi #Far Horizons
  - type: Clothing
    sprite: _FarHorizons/Clothing/Mask/syndigascaptain.rsi #Far Horizons
  - type: BreathMask
  - type: IngestionBlocker


- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskSlasher
  name: Slasher's Mask 
  description: A ominous mask that is a sign of doom for its victims.
  components:
  - type: FlashImmunity
    blocksSpecialVision: false
  - type: Sprite
    sprite: Clothing/Mask/mime.rsi
  - type: Clothing
    sprite: Clothing/Mask/mime.rsi
    stripDelay: 10
  - type: SelfUnremovableClothing
  - type: IdentityBlocker
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: Access
    tags:
    - External
    - Maintenance
  - type: IdCard
    bypassLogging: true
    canMicrowave: false
    fullNameLocId: slasher-mask-name
    fullName: ???
  - type: HideLayerClothing
    slots:
    - Snout
  - type: Armor
    ignoreKnockdown: true
    staminaDamageModifier: true
    modifiers:
      flatReductions: 
        Piercing: 5 
        Heat: 5 
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2