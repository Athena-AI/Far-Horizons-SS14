- type: entity
  name: Plasma Cutter
  parent: Welder
  id: WeaponPlasmaCutter
  description: You could use it to cut limbs off of xenos! Or, you know, mine stuff.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Battery/plasma_cutter.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Battery/plasma_cutter.rsi
  - type: SolutionContainerManager
    solutions:
      Welder:
        maxVol: 100
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 5
    color: "#ff75ed"
  - type: RequiresEyeProtection
  - type: WelderSurgery
    startSound:
      /Audio/Items/welder.ogg
    speed: 0.6
  - type: Tool
    speedModifier: 0.9
  - type: Welder
    fuelConsumption: 0.3
    fuelLitCost: 0.165
    fuelReagent: Plasma
    fuelDiscount: 0.3
  - type: Gun
    fireRate: 1.0
    minAngle: 1
    maxAngle: 20
    angleIncrease: 8
    angleDecay: 9
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
    projectileSpeed: 25
  - type: SolutionAmmoProvider
    solutionId: Welder
    proto: BulletPlasmaCutter
    maxShots: 1
    fireCost: 1
  - type: UseDelay
    delay: 1
  - type: ItemSlots
    slots:
      fuel_canister:
        name: Fuel Canister
        startingItem: PlasmaCutterFuelCanister
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
  - type: ExternalSolution
    solution: Welder

- type: entity
  name: Plasma Cutter Fuel Canister
  parent: BaseItem
  id: PlasmaCutterFuelCanisterEmpty
  description: A canister that contains highly concentrated liquid plasma. Used typical to fuel the plasma cutter.
  suffix: Empty
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Battery/plasma_cutter.rsi
    state: fuel_canister
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 30
  - type: RefillableSolution
    solution: beaker
  - type: ExaminableSolution
    solution: beaker
  - type: SolutionItemStatus
    solution: beaker
  - type: Item
    size: Small
    sprite: _FarHorizons/Objects/Weapons/Guns/Battery/plasma_cutter.rsi
    state: fuel_canister
    shape:
    - 0,1,0,0
  - type: StaticPrice
    price: 100

- type: entity
  name: Plasma Cutter Fuel Canister
  parent: PlasmaCutterFuelCanisterEmpty
  id: PlasmaCutterFuelCanister
  description: A canister that contains highly concentrated liquid plasma. Used typical to fuel the plasma cutter.
  suffix: Full
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        reagents:
        - ReagentId: Plasma
          Quantity: 30
        maxVol: 30