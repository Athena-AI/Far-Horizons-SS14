- type: disease
  id: DiseaseGBS
  name: disease-DiseaseGBS-name
  desc: disease-DiseaseGBS-desc
  symptoms: 
  - symptom: SymptomCough
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomSneeze
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomGasp
    probability:
      3: 0.05
  - symptom: SymptomGib
  cureSteps:
  - !type:CureConditions
    conditions:
    - !type:CureReagent
      reagent: Diphenhydramine
      min: 5
    - !type:CureReagent
      reagent: Bruizine
      min: 5
  - !type:CureWait
    requiredTicks: 900
  - !type:CureBedrest
      bedrestChance: 0.00066 #Abysmally Low to have an average of 300 ticks before a heal if they sleep
      sleepMultiplier: 5
  stats:
    resistance: 1
    stealth: 1
    speed: 1
    transmittable: 1
  stealth: [ Hidden, VeryHidden ]
  spreadPath: [ NonContagious ]

