- type: diseaseSymptom
  id: SymptomCough
  name: disease-symptom-SymptomCough-name
  onlyAlive: true
  stages: !type:DiseaseStageCondition
    min: 1
  airborneBurst:
    rangeMultiplier: 1.75
    chanceMultiplier: 1.5
  behaviors:
  - !type:SymptomStatusEffect
    effects:
    - !type:Emote
      emote: Cough
      showInChat: true
  level: 1
  stats:
    stealth: 1
    resistance: 1
    speed: 1
    transmittable: 1

