- type: disease
  id: DiseaseCold
  name: disease-DiseaseCold-name
  desc: disease-DiseaseCold-desc
  spreadPath: [ Airborne ]
  permeabilityMod: 0.5
  stages: [300, 150]
  symptoms:
  - symptom: SymptomCough
    stages: [1, 2]
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomSneeze
    stages: [1, 2]
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomFever
    stages: [2]
  - symptom: SymptomTransitionToFlu
    stages: [2]
  cureSteps:
  - !type:CureConditions
    cureChance: 0.15
    conditions:
    - !type:ReagentCondition
      reagent: Spaceacillin
      min: 1
    - !type:TemperatureCondition
      max: 308.15
  - !type:CureWait
    requiredTicks: 900
  - !type:CureBedrest
      bedrestChance: 0.00066 #Abysmally Low to have an average of 300 ticks before a heal if they sleep
      sleepMultiplier: 5

