- type: entity
  name: Sealable Beaker
  parent: SealableBeaker
  suffix: Aloe Extract
  description: Used to contain a moderate amount of chemicals and solutions. Can be sealed to avoid spills. Still pretty fragile.
  id: SealableBeakerAloe
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
        reagents:
        - ReagentId: Aloe
          Quantity: 50
  - type: Label
    currentLabel: Aloe Extract

