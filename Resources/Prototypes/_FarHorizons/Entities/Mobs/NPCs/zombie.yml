- type: entity
  name: zombie
  parent: MobHuman
  id: MobZombieSpreader
  suffix: Spreader
  categories: [ Spawner ]
  components:
    - type: RandomSpecies
    - type: RandomHumanoidAppearance
      randomizeName: true 
    - type: InputMover
    - type: MobMover
    - type: ZombifyOnSpawn
      

- type: entity
  name: zombie
  parent: MobZombieSpreader
  id: MobZombieNonSpreader
  suffix: NonSpreader
  categories: [ Spawner ]
  components:
    - type: ZombifyOnSpawn
      allowSpreading: false