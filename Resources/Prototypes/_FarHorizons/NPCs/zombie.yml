- type: htnCompound
  id: ZombieCompound
  branches:
    - tasks:
      #Combat
      - !type:HTNCompoundTask
          task: ZombieMeleeCombatCompound
      #Knockdown
    - preconditions:
      - !type:IsKnockedDownPrecondition
      tasks:
      - !type:HTNPrimitiveTask
        operator: !type:StandUpOperator
          shutdownState: TaskFinished
      #Idle 
    - tasks:
      - !type:HTNCompoundTask
        task: ZombieIdleCompound

#region Melee Combat
- type: htnCompound
  id: ZombieMeleeCombatCompound
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:UtilityOperator
          proto: ZombieNearbyMeleeTargets
      - !type:HTNCompoundTask
        task: BeforeZombieMeleeAttackTargetCompound

#Choose Targets
- type: utilityQuery
  id: ZombieNearbyMeleeTargets
  query:
    - !type:NearbyHostilesQuery
  considerations:
    - !type:TargetCanBeInfectedCon
      curve: !type:BoolCurve
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetHealthCon
      curve: !type:PresetCurve
        preset: TargetHealth
    - !type:TargetAccessibleCon
      curve: !type:BoolCurve
    - !type:TargetIsVisibleCon
      curve: !type:BoolCurve
    - !type:TargetInLOSOrCurrentCon
      curve: !type:BoolCurve

#Checks Before Attacking
- type: htnCompound
  id: BeforeZombieMeleeAttackTargetCompound
  branches:
    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnbuckleOperator
            shutdownState: TaskFinished

    - preconditions:
        - !type:PulledPrecondition
          isPulled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnPullOperator
            shutdownState: TaskFinished

    - preconditions:
        - !type:InContainerPrecondition
          isInContainer: true
      tasks:
        - !type:HTNCompoundTask
          task: EscapeCompound

    # Melee combat
    - tasks:
        - !type:HTNCompoundTask
          task: ZombieMeleeAttackTargetCompound

#Attacking with Melee
- type: htnCompound
  id: ZombieMeleeAttackTargetCompound
  branches:
    - preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:JumpOperator
            shutdownState: PlanFinished
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:MeleeOperator
            targetKey: Target
            targetState: Dead
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: MeleeRange
          services:
            - !type:UtilityService
              id: MeleeService
              proto: ZombieNearbyMeleeTargets
              key: Target

#region Idle
#region Idle
- type: htnCompound
  id: ZombieIdleCompound
  branches:
    # Join (or become) the swarm leader
    - tasks:
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:AssignedLeaderPrecondition
            targetKey: FollowTarget
            invert: true
        operator: !type:AssignLeaderOperator
          targetKey: FollowTarget
          searchRadius: 30
          whitelist:
            components:
            - Zombie

    # Head to follow target
    - tasks:
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:AssignedLeaderPrecondition
            targetKey: FollowTarget
          - !type:CoordinatesNotInRangePrecondition
            targetKey: FollowTarget
            rangeKey: FollowRange
        operator: !type:MoveToOperator
          pathfindInPlanning: true
          targetKey: FollowTarget
          rangeKey: FollowCloseRange
          removeKeyOnFinish: false

    # Keep idling near follow target
    - tasks:
      - !type:HTNPrimitiveTask
        preconditions:
          - !type:KeyExistsPrecondition
            key: IdleTime
          - !type:CoordinatesInRangePrecondition
            targetKey: FollowTarget
            rangeKey: FollowRange
        operator: !type:WaitOperator
          key: IdleTime

    # Pick a new idle spot near the follow target
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:PickAccessibleOperator
          rangeKey: FollowCloseRange
          targetCoordinates: FollowIdleTarget

      - !type:HTNPrimitiveTask
        operator: !type:MoveToOperator
          targetKey: FollowIdleTarget

      - !type:HTNPrimitiveTask
        operator: !type:RandomOperator
          targetKey: IdleTime
          minKey: MinimumIdleTime
          maxKey: MaximumIdleTime

      - !type:HTNPrimitiveTask
        preconditions:
          - !type:KeyExistsPrecondition
            key: IdleTime
          - !type:CoordinatesInRangePrecondition
            targetKey: FollowTarget
            rangeKey: FollowRange
        operator: !type:WaitOperator
          key: IdleTime