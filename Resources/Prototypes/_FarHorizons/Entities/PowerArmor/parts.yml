- type: entity
  id: PowerArmorPartBase
  name: Power Armor Part Base
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Normal
  - type: InteractionOutline
  - type: Clickable
  - type: Appearance
  - type: PowerArmorPart
    partType: Head
  - type: Damageable
  - type: Injurable
    damageContainer: LimbDamageContainer
    

#region Base Parts
- type: entity
  id: PowerArmorHelmetBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.Head"]
      offset: 0, -0.25 
      state: equipped-HEAD
  - type: PowerArmorPart
    partType: Head
    partVisuals: 
      Head:
      - state: equipped-HEAD
      - state: equipped-HEAD-light
        shader: unshaded

- type: entity
  id: PowerArmorChestBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.Chest"]
      state:  equipped-CHEST
  - type: PowerArmorPart
    partType: Chest
    partVisuals:
      Chest:
      - state: equipped-CHEST

- type: entity
  id: PowerArmorLArmBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.LArm"]
      offset: 0.25, 0
      state: equipped-LARM
  - type: PowerArmorPart
    partType: LArm
    partVisuals:
      LArm:
      - state: equipped-LARM

- type: entity
  id: PowerArmorRArmBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.RArm"]
      offset: -0.25, 0
      state: equipped-RARM
  - type: PowerArmorPart
    partType: RArm
    partVisuals:
      RArm:
      - state: equipped-RARM

- type: entity
  id: PowerArmorLLegBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.LLeg"]
      offset: 0.125, 0.25
      state: equipped-LLEG
  - type: PowerArmorPart
    partType: LLeg
    partVisuals:
      LLeg:
      - state: equipped-LLEG

- type: entity
  id: PowerArmorRLegBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.RLeg"]
      offset: -0.125, 0.25
      state: equipped-RLEG
  - type: PowerArmorPart
    partType: RLeg
    partVisuals:
      RLeg:
      - state: equipped-RLEG

#region NanoTrasen
- type: entity
  id: PowerArmorNTJuggernaut
  parent: PowerArmorPartBase
  name: NanoTrasen Heavy Hardsuit
  description: A piece of Powered Armor, if you're looking at this, you've either made a brand new piece or something has gone horribly wrong. Some Assembly Required.
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/PowerArmor/ntjuggsuit.rsi
  - type: PowerArmorPart
    sprite: _FarHorizons/Clothing/OuterClothing/PowerArmor/ntjuggsuit.rsi
    damageTransferModifier: 0.1
    modifiers:
      flatReductions:
        Piercing: 5
        Heat: 4
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
    brokenModifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70 
        Heat: 0.80
        Radiation: 0.25
    speedModifier: 0.0817 #Formula for this speed reduction is ClothingSpeedModifier × (1 − n × partPenalty)

- type: entity
  id: PowerArmorNTJuggernautLimbs
  parent: PowerArmorNTJuggernaut
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Repairable
    damageValue: -20 
    doAfterDelay: 1
    fuelCost: 5.0

#region Head

- type: entity
  id: PowerArmorHelmetNTJuggernaut
  parent: [ PowerArmorHelmetBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Helmet
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Repairable
    damageValue: -20 
    doAfterDelay: 1
    fuelCost: 5.0
  - type: PowerArmorPart
    partVisuals: 
      Head:
      - state: equipped-HEAD
      - state: equipped-HEAD-light
        shader: unshaded
      Head-avali:
      - state: equipped-HEAD-avali
      - state: equipped-HEAD-light-avali
        shader: unshaded
      Head-vox:
      - state: equipped-HEAD-vox
      - state: equipped-HEAD-light-vox
        shader: unshaded
      Head-vulpkanin:
      - state: equipped-HEAD-vulpkanin
      - state: equipped-HEAD-light-vulpkanin
        shader: unshaded

#region Chest

- type: entity
  id: PowerArmorChestNTJuggernaut
  parent: [PowerArmorChestBase, PowerArmorNTJuggernaut]
  name: NanoTrasen Heavy Hardsuit Chest
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Repairable
    damageValue: -40 
    doAfterDelay: 1
    fuelCost: 5.0

#region Arms

- type: entity
  id: PowerArmorLArmNTJuggernaut
  parent: [PowerArmorLArmBase, PowerArmorNTJuggernautLimbs]
  name: NanoTrasen Heavy Hardsuit Left Arm

- type: entity
  id: PowerArmorRArmNTJuggernaut
  parent: [PowerArmorRArmBase, PowerArmorNTJuggernautLimbs]
  name: NanoTrasen Heavy Hardsuit Right Arm

#region Legs

- type: entity
