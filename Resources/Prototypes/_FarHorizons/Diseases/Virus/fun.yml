- type: disease
  id: DiseaseGBS
  name: disease-DiseaseGBS-name
  desc: disease-DiseaseGBS-desc
  spreadPath: [ NonContagious ]
  stages: [60, 120, 120, 180]
  symptoms: 
  - symptom: SymptomCough
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomSneeze
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomGasp
    probability:
      3: 0.05
  - symptom: SymptomGib
  cureSteps:
  - !type:CureConditions
    cureChance: 0.15 # Higher chance to cure, since two reagents are required.
    conditions:
    - !type:ReagentCondition
      reagent: Diphenhydramine
      min: 1
    - !type:ReagentCondition
      reagent: Sulfur
      min: 1

- type: disease
  id: DiseaseHonkSyndrome
  name: disease-DiseaseHonkSyndrome-name
  desc: disease-DiseaseHonkSyndrome-desc
  spreadPath: [ NonContagious ]
  stages: [120, 180]
  symptoms:
    - symptom: SymptomJitters
    - symptom: SymptomEmoteHonk
    - symptom: SymptomHonkShout
  cureSteps:
  - !type:CureConditions
    conditions:
    - !type:ReagentCondition
      reagent: BananaHonk
      min: 1
  - !type:CureWait
    requiredTicks: 900
  - !type:CureBedrest
      bedrestChance: 0.00066 #Abysmally Low to have an average of 300 ticks before a heal if they sleep
      sleepMultiplier: 5

