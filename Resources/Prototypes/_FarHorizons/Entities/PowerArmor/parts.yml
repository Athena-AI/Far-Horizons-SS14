- type: entity
  id: PowerArmorPartBase
  name: Power Armor Part Base
  abstract: true
  components:
  - type: Item
  - type: InteractionOutline
  - type: Clickable
  - type: Appearance
  - type: Sprite
    sprite: _FarHorizons/Clothing/Head/PowerArmor/powerarmor.rsi
  - type: PowerArmorPart
    partType: Head
  - type: Damageable

#region Head
- type: entity
  id: PowerArmorHelmetBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: PowerArmorPart
    partType: Head

- type: entity
  id: PowerArmorHelmetNTJuggernaut
  parent: PowerArmorHelmetBase
  name: NanoTrasen Heavy Hardsuit Helmet
  description: A helmet developed by Telos Industries made of pure plasteel that can take excessive amounts of punishment before requiring repairs.
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.Head"]
      state: equipped-head
  - type: PowerArmorPart
    modifiers:
      flatReductions:
        Piercing: 5
        Heat: 4
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]

#region Chest

#region Arms

#region Legs