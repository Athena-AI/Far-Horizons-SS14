- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphIncorporealize
  name: Incorporealize
  description: Melt into the Ethereal Plane for a quick getaway!
  components:
  - type: Magic
  - type: Action
    useDelay: 30
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: jaunt
  - type: InstantAction
    event: !type:IncorporealizeActionEvent
      protoId: Incorporealize

- type: entity
  parent: BaseAction
  id: ActionRevertIncorporealize
  name: Revert
  description: Revert back into your original form.
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: jaunt
    startDelay: true
  - type: ConfirmableAction
    popup: revert-polymorph-action-popup
  - type: InstantAction
    event: !type:RevertIncorporealizeActionEvent